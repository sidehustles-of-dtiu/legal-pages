<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap"><title>Studio · Studio</title><style>:root{--bg:#F3F4F7;--surface:#FFFFFF;--text:#101828;--muted:#667085;--accent:#2563EB;--accent-soft:#E8EFFE;
--border:#E4E7EC;--radius:20px;--radius-c:12px;--shadow:0 1px 2px rgba(16,24,40,.04),0 2px 6px rgba(16,24,40,.04)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1020;--surface:#131A2E;--text:#EEF2FA;--muted:#98A2B3;--accent:#5B8DEF;--accent-soft:#1A2A4A;--border:#1F2A44}}
:root[data-theme="dark"]{--bg:#0B1020;--surface:#131A2E;--text:#EEF2FA;--muted:#98A2B3;--accent:#5B8DEF;--accent-soft:#1A2A4A;--border:#1F2A44}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 "Plus Jakarta Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
header{max-width:46rem;margin:0 auto;padding:20px 16px 0;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.brand{font-weight:700;font-size:18px;letter-spacing:-.02em;color:var(--text);text-decoration:none}
nav{display:flex;flex-wrap:wrap;gap:8px}
nav a{font-size:14px;padding:6px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--border);color:var(--text);text-decoration:none}
nav a[aria-current="page"]{background:var(--accent-soft);border-color:transparent;color:var(--accent);font-weight:600}
main{max-width:46rem;margin:20px auto 0;padding:0 16px}
article,.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:32px}
h1{font-size:32px;line-height:1.15;letter-spacing:-.02em;margin:0 0 12px;font-weight:700}
h2{font-size:21px;line-height:1.25;letter-spacing:-.01em;margin:32px 0 8px;font-weight:700}
p,li{color:var(--text)}
ul{padding-left:1.25rem}li{margin:4px 0}
a{color:var(--accent)}
code{font-size:.92em;background:var(--accent-soft);padding:1px 6px;border-radius:6px}
.notice{background:var(--accent-soft);color:var(--text);border-radius:var(--radius-c);padding:12px 16px;font-size:14px}
.hero p{color:var(--muted);margin:0 0 20px}
.index li{list-style:none;margin:0 0 10px}
.index a{display:block;padding:14px 16px;border:1px solid var(--border);border-radius:var(--radius-c);background:var(--bg);text-decoration:none;color:var(--text);font-weight:600}
.index a:hover{border-color:var(--accent)}
footer{max-width:46rem;margin:24px auto 40px;padding:0 16px;color:var(--muted);font-size:14px}
footer a{color:var(--muted)}
@media (max-width:600px){article,.card{padding:22px 18px}h1{font-size:26px}h2{font-size:19px}main{padding:0 16px}}</style></head><body><header><a class="brand" href="index.html">Studio</a><nav><a href="privacy-policy.html">Privacy policy</a><a href="terms-of-service.html">Terms of service</a><a href="platform-guidelines.html">Platform guidelines</a></nav></header><main><article><div class="hero"><h1>Studio</h1><p>A private tool for one person's own video channels.</p></div><ul class="index"><li><a href="privacy-policy.html">Privacy policy</a></li><li><a href="terms-of-service.html">Terms of service</a></li><li><a href="platform-guidelines.html">Platform guidelines</a></li></ul></article></main><footer>Last updated 2026-10-16. Contact: <a href="mailto:dittotiu111@yahoo.com">dittotiu111@yahoo.com</a></footer></body></html>
